<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2220">
<meta name="description" content="Collares GPS para ovejas y cuaderno de campo: pérdidas por depredadores y sarna.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Majada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDEFE8; --surface:#FFFFFF; --sunk:#E2E5DC; --ink:#1C2220; --muted:#57615B; --line:#D2D7CD;
  --coiron:#B7842A; --steel:#2E6386; --on-steel:#FFFFFF; --steel-soft:#DCE7EF; --rust:#A63F2B; --rust-soft:#F3E0D9; --on-rust:#FFFFFF;
  --ok:#3A7345; --warn:#A8700A; --crit:#B23A26; --crit-soft:#F6DFD8; --warn-soft:#F5E9CF; --off:#7E8781;
  --f-disp:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131715; --surface:#1B201D; --sunk:#242A26; --ink:#E7EBE4; --muted:#9BA59E; --line:#313934;
    --coiron:#D8AD55; --steel:#79AED2; --on-steel:#131715; --steel-soft:#1D2E3A; --rust:#E07A62; --rust-soft:#3A2520; --on-rust:#131715;
    --ok:#7DBA87; --warn:#E0B354; --crit:#E8735C; --crit-soft:#3B221C; --warn-soft:#352C17; --off:#8B948E;
  }
}
:root[data-theme="dark"]{
  --bg:#131715; --surface:#1B201D; --sunk:#242A26; --ink:#E7EBE4; --muted:#9BA59E; --line:#313934;
  --coiron:#D8AD55; --steel:#79AED2; --on-steel:#131715; --steel-soft:#1D2E3A; --rust:#E07A62; --rust-soft:#3A2520; --on-rust:#131715;
  --ok:#7DBA87; --warn:#E0B354; --crit:#E8735C; --crit-soft:#3B221C; --warn-soft:#352C17; --off:#8B948E;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in,.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding-block:6px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.logo{font-family:var(--f-disp);font-weight:700;font-size:1.5rem}
.logo::after{content:"";display:inline-block;width:.42em;height:.42em;background:var(--coiron);border-radius:50%;margin-left:.12em}
.sub{color:var(--muted);font-family:var(--f-disp);font-weight:600;font-size:1.05rem}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap}
.conn i{width:9px;height:9px;border-radius:50%;background:var(--off)}
.conn.ok i{background:var(--ok)} .conn.err i{background:var(--crit)} .conn.demo i{background:var(--coiron)} .conn.wait i{background:var(--warn)}

main{padding-block:12px 100px}
.stack{display:grid;gap:12px}
.blk{display:grid;gap:12px;padding-block:18px;border-top:1px solid var(--line)}
.blk:first-child{border-top:0;padding-top:4px}
.blk h2{font-size:1.3rem}
.eyebrow{font-family:var(--f-disp);font-weight:600;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.88rem} .hint{font-size:.86rem;color:var(--muted)}
.banner{display:grid;gap:8px;background:var(--surface);border:1px dashed var(--coiron);border-radius:var(--r);padding:12px 14px;font-size:.94rem}

/* mapa */
.map{position:relative;height:min(58vh,560px);min-height:300px;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);
  background-color:var(--sunk);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;
  touch-action:none;user-select:none;-webkit-user-select:none}
.map .tiles{position:absolute;inset:0}
.map img.tile{position:absolute;left:0;top:0;width:256px;height:256px;max-width:none;pointer-events:none;-webkit-user-drag:none}
.map svg.ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mapctl{position:absolute;right:10px;top:10px;display:grid;gap:8px}
.mapbtn{min-width:44px;height:44px;padding-inline:10px;border-radius:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.18);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.mapbtn svg{width:20px;height:20px}
.maptl{position:absolute;left:10px;top:10px;display:flex;gap:8px}
.attr{position:absolute;right:4px;bottom:2px;font-size:10px;line-height:1.4;background:rgba(255,255,255,.75);color:#333;padding:0 4px;border-radius:3px;pointer-events:none}
.editbar{margin-top:10px;background:var(--surface);border:2px solid var(--coiron);border-radius:12px;padding:12px;display:grid;gap:8px}
.editbar .row{gap:8px}
.lim{fill:rgba(216,173,85,.12);stroke:#D8AD55;stroke-width:3;stroke-linejoin:round}
.lim.edit{stroke-dasharray:9 6}
.vtx{fill:#fff;stroke:#1C2220;stroke-width:2}
.trk{fill:none;stroke:#79AED2;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;opacity:.9}
.trkpt{fill:#79AED2}
.mk{cursor:pointer}
.mk circle.dot{stroke:#fff;stroke-width:3}
.mk.st-ok circle.dot{fill:#3A7345} .mk.st-fuera circle.dot{fill:#C8402A} .mk.st-quieta circle.dot{fill:#C98A12} .mk.st-sin circle.dot{fill:#7E8781}
.mk circle.ring{fill:none;stroke:#fff;stroke-width:2.5;stroke-dasharray:4 3}
.mk text{font-family:var(--f-disp);font-weight:700;font-size:14px;fill:#fff;stroke:#111;stroke-width:4px;paint-order:stroke;text-anchor:middle}
.mk text.g{font-size:13px;stroke:none;fill:#fff}
.me{fill:#2F7CF6;stroke:#fff;stroke-width:3} .meacc{fill:rgba(47,124,246,.15);stroke:rgba(47,124,246,.5);stroke-width:1}

/* lista collares */
.estado-base{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted)}
.estado-base b{color:var(--ink)}
.list{display:grid;border-top:1px solid var(--line)}
.crow{display:grid;grid-template-columns:18px 1fr auto;gap:12px;align-items:center;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.crow[aria-current="true"]{background:var(--steel-soft)}
.crow .n{font-family:var(--f-disp);font-weight:700;font-size:1.15rem}
.crow .s{font-size:.9rem}
.crow .r{text-align:right;font-size:.85rem;color:var(--muted);white-space:nowrap}
.sd{width:14px;height:14px;border-radius:50%;justify-self:center}
.sd.st-ok{background:var(--ok)} .sd.st-fuera{background:var(--crit)} .sd.st-quieta{background:var(--warn)} .sd.st-sin{background:var(--off)}
.tx-ok{color:var(--ok)} .tx-fuera{color:var(--crit);font-weight:600} .tx-quieta{color:var(--warn);font-weight:600} .tx-sin{color:var(--muted)}
.bat{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.bat.low{color:var(--crit);font-weight:600}
.det{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.det h2{font-size:1.5rem}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:.95rem}
.det dt{color:var(--muted)} .det dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;min-height:30px;padding:3px 12px;border-radius:999px;font-weight:600;font-size:.88rem}
.pill.st-ok{background:var(--sunk);color:var(--ok)} .pill.st-fuera{background:var(--crit-soft);color:var(--crit)} .pill.st-quieta{background:var(--warn-soft);color:var(--warn)} .pill.st-sin{background:var(--sunk);color:var(--muted)}

/* alertas */
.arow{display:grid;grid-template-columns:18px 1fr;gap:12px;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.arow .t{font-weight:600} .arow .b{font-size:.9rem;color:var(--muted)}
.arow.nueva{background:var(--warn-soft)}
.sev{width:12px;height:12px;margin-top:6px;justify-self:center}
.sev.crit{background:var(--crit);border-radius:50%} .sev.warn{background:var(--warn);transform:rotate(45deg)} .sev.info{background:var(--ok);border-radius:3px}

/* ajustes */
.field{display:grid;gap:6px}
.field label,.lab{font-family:var(--f-disp);font-weight:600;font-size:1.02rem}
input[type=text],input[type=password],input[type=number],input[type=url],input[type=date],textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:10px;border:1px solid transparent;font-weight:600;text-decoration:none;text-align:center}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sec{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.steel{background:var(--steel);color:var(--on-steel)}
.btn.danger{background:none;border-color:var(--crit);color:var(--crit)}
.btn.link{background:none;border:0;padding-inline:4px;color:var(--steel);text-decoration:underline;min-height:44px}
.btn.full{width:100%}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.92rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.switch input{width:52px;height:30px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked{background:var(--ok)} .switch input:checked::after{left:25px}
.crow-edit{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;padding-block:8px;border-bottom:1px solid var(--line)}
.err{color:var(--crit);font-size:.9rem;font-weight:600}
.okt{color:var(--ok);font-size:.9rem;font-weight:600}
ol.guia{margin:0;padding-left:1.3em;display:grid;gap:6px;font-size:.94rem}
code{font-size:.85em;background:var(--sunk);padding:1px 5px;border-radius:4px;word-break:break-all}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{position:relative;display:grid;justify-items:center;gap:2px;padding:9px 4px 10px;border:0;background:none;color:var(--muted);font-size:.8rem;font-weight:600}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{stroke:var(--coiron)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--crit);color:#fff;font-size:.75rem;line-height:20px;text-align:center}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* registros en el mapa */
.rg{cursor:pointer}
.rg-p path{stroke:#fff;stroke-width:6;stroke-linecap:round} .rg-p path.i{stroke:#B23A26;stroke-width:3}
.rg-s rect{fill:#2E6386;stroke:#fff;stroke-width:2}
.maplegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted);padding-top:8px}
.maplegend span{display:inline-flex;align-items:center;gap:5px}
.lg-c{width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.lg-x{font-weight:800;color:var(--crit);line-height:1}
.lg-d{width:9px;height:9px;background:var(--steel);transform:rotate(45deg)}

/* registros: resumen */
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:360px){.acciones{grid-template-columns:1fr}}
.big{display:grid;align-content:space-between;gap:10px;min-height:112px;text-align:left;border:0;border-radius:14px;padding:16px}
.big b{font-family:var(--f-disp);font-size:1.4rem;line-height:1.05}
.big span{font-size:.9rem;opacity:.92}
.big.perdida{background:var(--rust);color:var(--on-rust)}
.big.sarna{background:var(--steel);color:var(--on-steel)}
.num{font-family:var(--f-disp);font-weight:700;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.bigstat{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:8.5rem 1fr 2.4rem;align-items:center;gap:10px;font-size:.95rem}
.bar .track{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--rust)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.stacked{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.stacked i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.remrow{display:grid;gap:6px}
.remrow .h{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.c-ok{background:var(--ok)} .c-ok2{background:var(--ok);opacity:.5} .c-warn{background:var(--warn)} .c-crit{background:var(--crit)}
.item{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item .t{font-weight:600} .item .s{font-size:.88rem;color:var(--muted)}
.item img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.item .d{font-size:.85rem;color:var(--muted);white-space:nowrap}
.ico{width:14px;height:14px;justify-self:center}
.ico.perdida{background:var(--rust);border-radius:50%}
.ico.sarna{background:var(--steel);transform:rotate(45deg);width:12px;height:12px}
.mes{font-family:var(--f-disp);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.82rem;color:var(--muted);padding:18px 2px 6px}
.ej{font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--coiron);margin-left:6px}
.pend{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;background:var(--steel-soft);border-radius:var(--r)}
.filt{display:flex;gap:8px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-disp);font-weight:600;color:var(--muted);letter-spacing:.03em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

/* registros: formularios */
.ffield{display:grid;gap:8px;padding-block:14px;border-top:1px solid var(--line)}
.ffield>label,.ffield>.lab{font-family:var(--f-disp);font-weight:600;font-size:1.05rem}
textarea{min-height:88px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips.lg .chip{min-height:54px;padding-inline:20px;font-size:1.05rem}
.chips.seg{display:grid;grid-template-columns:repeat(3,1fr)}
.chips.seg .chip{border-radius:10px;padding-inline:8px;line-height:1.15}
.form.perdida .chip[aria-pressed="true"]{background:var(--rust);border-color:var(--rust);color:var(--on-rust)}
.form.sarna .chip[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:var(--on-steel)}
.stepper{display:grid;grid-template-columns:56px minmax(0,140px) 56px;gap:8px;align-items:center}
.stepper button{height:54px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.6rem;font-weight:600}
.stepper input{text-align:center;font-family:var(--f-disp);font-weight:700;font-size:1.6rem;min-height:54px}
.gps{display:grid;gap:8px}
.gps .st{display:flex;align-items:center;gap:8px;font-weight:600}
.gps .st.ok{color:var(--ok)}
.foto img{max-width:100%;max-height:260px;border-radius:10px;display:block}
.savebar{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding-block:16px 18px;margin-top:8px}
.aviso{background:var(--steel-soft);border-radius:var(--r);padding:12px 14px;font-size:.92rem}
.pots{display:grid;border-top:1px solid var(--line)}
.pots div{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:4px 2px}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px}

/* hoja de detalle */
.sheet{position:fixed;inset:0;z-index:20;display:grid;align-items:end;background:rgba(10,14,12,.5)}
.sheet-in{background:var(--bg);border-radius:16px 16px 0 0;max-height:88vh;overflow:auto;width:100%;max-width:640px;margin:0 auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet-in dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.sheet-in dt{color:var(--muted)} .sheet-in dd{margin:0;font-weight:500}

/* informe */
.informe h1{font-size:1.7rem}
.informe h2{font-size:1.2rem;margin-top:18px}
@media print{
  .top,.tabs,.noprint,.toast{display:none!important}
  body{background:#fff;color:#000;font-size:12px}
  main{padding:0}
  th,td{border-color:#bbb}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="logo">Majada</span><span class="sub" id="hdr-campo">Mi campo</span></div>
  <span class="conn" id="conn"><i></i><span id="conn-t">…</span></span>
</div></header>
<main><div class="wrap">
  <div id="v-mapa">
    <div class="map" id="map" aria-label="Mapa del campo con la ubicación de los collares">
      <div class="tiles" id="tiles"></div>
      <svg class="ov" id="ov" aria-hidden="false"></svg>
      <div class="maptl"><button class="mapbtn" id="btn-capa" data-act="capa">Ver mapa</button><button class="mapbtn" id="btn-reg" data-act="ver-reg" aria-pressed="true">Registros</button></div>
      <div class="mapctl">
        <button class="mapbtn" data-act="zin" aria-label="Acercar">+</button>
        <button class="mapbtn" data-act="zout" aria-label="Alejar">−</button>
        <button class="mapbtn" data-act="fit" aria-label="Ver todas las ovejas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="mapbtn" data-act="yo" aria-label="Mi ubicación"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      </div>
      <div class="attr" id="attr"></div>
    </div>

      if (qos > 0) { const id = (c[p] << 8) | c[p + 1]; p += 2; if (qos === 1) this.enviar(new Uint8Array([0x40, 2, id >> 8, id & 255])); }
      this.o.mensaje(topic, c.slice(p)); }
    else if (t === 9) { if (c[2] === 0x80) this.o.estado('err', 'El servidor no aceptó el tema. Revisá el campo "Tema".'); }
  }
  suscribir(topic){ const id = this.pid = (this.pid % 65535) + 1; this.enviar(this.paquete(0x82, [id >> 8, id & 255, ...MiniMQTT.str(topic), 1])); }
  terminar(){ this.cerrado = true; clearTimeout(this.rt); clearInterval(this.ping); this.enviar(new Uint8Array([0xE0, 0])); try { this.ws && this.ws.close(); } catch(e) {} this.ws = null; }
}
let cliente = null;
function conectar(){
  if (cliente) { cliente.terminar(); cliente = null; }
  const m = S.cfg.mqtt; if (S.cfg.demo || !m.url) { S.conn = S.cfg.demo ? 'demo' : 'off'; S.connMsg = ''; pintarConn(); return; }
  cliente = new MiniMQTT({ url: m.url.trim(), user: m.user.trim(), pass: m.pass, topic: (m.topic || 'msh/AR/2/json/#').trim(), clientId: m.clientId, limpia: false,
    estado: (st, msg) => { S.conn = st; S.connMsg = msg; pintarConn(); if (S.tab === 'ajustes') pintarOtro(); },
    mensaje: (topic, bytes) => procesar(topic, bytes) });
  cliente.conectar();
}

/* ---------- mensajes de Meshtastic (JSON por MQTT) ---------- */
const nodoId = n => '!' + (Number(n) >>> 0).toString(16).padStart(8, '0');
let evalT;
function procesar(topic, bytes){
  let m; try { m = JSON.parse(new TextDecoder().decode(bytes)); } catch(e) { return; }
  if (!m || typeof m !== 'object' || m.from == null) return;
  const id = nodoId(m.from), ahora = Date.now();
  let t = (Number(m.timestamp) || 0) * 1000; if (!t || t > ahora + 10 * MIN || t < ahora - 30 * 24 * H) t = ahora;
  S.base = { id: m.sender || (S.base && S.base.id) || null, visto: Math.max(ahora, (S.base && S.base.visto) || 0) };
  if (m.sender && id === m.sender) { guardar(); programarEval(); return; } // mensaje de la propia base del casco
  const p = m.payload || {};
  const c = S.collares[id] = S.collares[id] || { id, nombre: 'Collar ' + id.slice(-4).toUpperCase(), hist: [], ultimo: null, bateria: null, visto: 0, nuevo: true };
  c.visto = Math.max(c.visto || 0, t);
  if (m.type === 'position' && p.latitude_i != null && p.longitude_i != null) {
    const lat = p.latitude_i / 1e7, lon = p.longitude_i / 1e7; if (!lat && !lon) return;
    const tp = p.time ? Math.min(p.time * 1000, ahora + MIN) : t;
    if (!c.hist.some(q => Math.abs(q.t - tp) < 1000 && q.lat === lat && q.lon === lon)) {
      c.hist.push({ lat, lon, t: tp }); if (c.hist.length > 1 && c.hist[c.hist.length - 2].t > tp) c.hist.sort((a, b) => a.t - b.t);
      const corte = ahora - HIST_MS; c.hist = c.hist.filter(q => q.t >= corte).slice(-HIST_MAX); c.ultimo = c.hist[c.hist.length - 1];
    }
  } else if (m.type === 'telemetry' && p.battery_level != null) { c.bateria = Math.min(100, Number(p.battery_level)); }
  else if (m.type === 'nodeinfo' && c.nuevo && (p.longname || p.shortname)) { c.nombre = String(p.longname || p.shortname).slice(0, 24); }
  guardar(); programarEval();
}
function programarEval(){ clearTimeout(evalT); evalT = setTimeout(() => { evaluar(); pintarTodo(); }, 400); }

/* ---------- estados y avisos ---------- */
function quietud(c, ahora){
  const hist = c.hist, qH = S.cfg.quietaH * H; if (hist.length < 2) return null;
  const last = hist[hist.length - 1]; if (ahora - last.t > S.cfg.sinSenalH * H) return null;
  let i = hist.length - 1; while (i > 0 && dist(hist[i - 1], last) <= S.cfg.radio) i--;
  const desde = hist[i].t; if (ahora - desde < qH) return null;
  const otros = Object.values(S.collares).filter(o => o.id !== c.id && o.hist.length > 1 && ahora - o.visto < S.cfg.sinSenalH * H);
  if (otros.length) { const semov = otros.some(o => { const w = o.hist.filter(p => p.t >= desde); return w.length > 1 && Math.max(...w.map(p => dist(p, w[w.length - 1]))) > 150; }); if (!semov) return null; }
  return { desde, horas: (ahora - desde) / H, comparada: otros.length > 0 };
}
function estadoDe(c, ahora = Date.now()){
  const lim = S.cfg.limite, baseCaida = S.base && ahora - S.base.visto > S.cfg.sinSenalH * H;
  if (!c.ultimo) return { clase: 'st-sin', texto: 'Esperando la primera ubicación' };
  if (!baseCaida && ahora - c.visto > S.cfg.sinSenalH * H) return { clase: 'st-sin', texto: 'Sin señal ' + hace(c.visto), sin: true };
  if (lim.length >= 3 && !dentro(c.ultimo, lim)) return { clase: 'st-fuera', texto: 'Fuera del campo · a ' + mts(distBorde(c.ultimo, lim)) + ' del alambrado', fuera: true };
  const q = quietud(c, ahora); if (q) return { clase: 'st-quieta', texto: `Quieta hace ${Math.floor(q.horas)} h${q.comparada ? ' (el resto se movió)' : ''}`, quieta: q };
  return { clase: 'st-ok', texto: lim.length >= 3 ? 'Dentro del campo' : 'Ubicación al día' };
}
function aviso(tipo, sev, c, titulo, cuerpo, t){
  const a = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: t || Date.now(), tipo, sev, collar: c ? c.id : null, titulo, cuerpo, nueva: true, demo: !!(c && c.demo) };
  S.alertas.unshift(a); S.alertas = S.alertas.slice(0, 300);
  if (sev !== 'info' && !a.demo) notificar(titulo, cuerpo, tipo + (c ? c.id : ''));
}
function evaluar(){
  const ahora = Date.now();
  const bq = S.base && ahora - S.base.visto > S.cfg.sinSenalH * H;
  const be = S.estado.__base || {};
  if (bq && !be.caida) aviso('base', 'warn', null, `La base del casco no manda datos ${hace(S.base.visto)}`, 'Revisá que estén prendidos el Starlink y la placa. Mientras tanto no llegan ubicaciones.');
  if (!bq && be.caida) aviso('base', 'info', null, 'La base del casco volvió a mandar datos', '');
  S.estado.__base = { caida: !!bq };
  for (const c of Object.values(S.collares)) {
    const e = estadoDe(c, ahora), prev = S.estado[c.id] || {}; const now = { fuera: !!e.fuera, quieta: !!e.quieta, sin: !!e.sin, bat: c.bateria != null && c.bateria <= S.cfg.bateria };
    if (now.fuera && !prev.fuera) { let k = c.hist.length - 1; while (k > 0 && !dentro(c.hist[k - 1], S.cfg.limite)) k--;
      aviso('fuera', 'crit', c, `${c.nombre} salió del campo`, `Está a ${mts(distBorde(c.ultimo, S.cfg.limite))} del alambrado. Tocá para ver dónde.`, c.hist[k] ? c.hist[k].t : ahora); }
    if (!now.fuera && prev.fuera && c.ultimo && S.cfg.limite.length >= 3) aviso('volvio', 'info', c, `${c.nombre} volvió al campo`, '');
    if (now.quieta && !prev.quieta) aviso('quieta', 'crit', c, `${c.nombre} no se mueve hace ${Math.floor(e.quieta.horas)} h`, e.quieta.comparada ? 'El resto de la majada se movió. Puede estar caída o muerta: conviene ir a ver.' : 'Puede estar descansando, caída o muerta. Conviene ir a ver.', e.quieta.desde + S.cfg.quietaH * H);
    if (now.sin && !prev.sin) aviso('sin', 'warn', c, `Sin señal de ${c.nombre} ${hace(c.visto)}`, 'Puede ser batería agotada, el collar caído o que esté fuera del alcance de la base.');
    if (now.bat && !prev.bat) aviso('bat', 'warn', c, `Batería baja en ${c.nombre}: ${c.bateria}%`, 'Cargalo en los próximos días.');
    S.estado[c.id] = now;
  }
  guardar();
}
async function notificar(titulo, cuerpo, tag){
  if (!S.cfg.notif || !('Notification' in window) || Notification.permission !== 'granted') return;
  try { const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) reg.showNotification(titulo, { body: cuerpo, tag, icon: 'icon-192.png', badge: 'icon-192.png' }); else new Notification(titulo, { body: cuerpo, tag }); } catch(e) {}
}

const CAUSAS = [['puma','Puma'],['zorro','Zorro'],['perro','Perros'],['clima','Frío / nevada'],['otra','Enfermedad u otra'],['desconocida','No sé']];
const CAT = [['oveja','Oveja','ovejas'],['cordero','Cordero','corderos'],['borrego','Borrego','borregos'],['carnero','Carnero','carneros'],['capon','Capón','capones']];

    const k = remLabel(t); m[k] = m[k] || { curados: 0, mejoraron: 0, igual: 0, peor: 0, n: 0 }; m[k][r.resultado]++; m[k].n++; });

async function entregar(nombre, contenido, mime){
  const blob = new Blob([contenido], { type: mime });
  try { const file = new File([blob], nombre, { type: mime }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: nombre }); return; } } catch(e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast('Archivo listo: ' + nombre);
}

async function restaurar(file){
  try { const data = JSON.parse(await file.text()); if (data.app !== 'majada' || !Array.isArray(data.eventos)) throw new Error('formato');
    if (!await confirmar(`La copia tiene ${data.eventos.length} registros. Se suman a los que ya tenés; no se borra nada.`, 'Restaurar')) return;
    const ids = new Set(S.eventos.map(e => e.id)); let n = 0;
    for (const ev of data.eventos) if (ev && ev.id && !ids.has(ev.id)) { S.eventos.push(ev); await DB.evPut(ev); n++; }
    const c = data.config || {}; (c.potreros || []).forEach(p => { if (!S.cfg.potreros.includes(p)) S.cfg.potreros.push(p); });
    if (!S.cfg.campo && c.campo) S.cfg.campo = c.campo; if ((!S.cfg.limite.length || S.cfg.limiteDemo) && c.limite && c.limite.length >= 3 && !c.limiteDemo) { S.cfg.limite = c.limite; S.cfg.limiteDemo = false; }
    guardar(); toast(`Se restauraron ${n} registros`); pintarTodo(); pintarOtro();
  } catch(e) { toast('Ese archivo no es una copia de Majada.'); }

/* ---------- demostración (collares simulados) ---------- */
const DC = [-45.6235, -67.9412];
const mLL = (dx, dy) => [+(DC[0] + dy / 111320).toFixed(6), +(DC[1] + dx / (111320 * Math.cos(rad(DC[0])))).toFixed(6)];
const DEMO_IDS = ['!de000001', '!de000002', '!de000003'];
let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647 - 0.5; };
const majada = t => { const th = (t / (10 * H)) * 2 * Math.PI; return [250 * Math.cos(th) - 60, 200 * Math.sin(th) + 20]; };
function crearDemo(){
  const ahora = Date.now(), paso = 20 * MIN, QUIETA = 7 * H, FUERA = 80 * MIN;
  if (!S.cfg.limite.length) { S.cfg.limite = [[-520, -480], [560, -520], [610, 380], [80, 560], [-560, 420]].map(([x, y]) => mLL(x, y)); S.cfg.limiteDemo = true; }
  const mk = (id, nombre, bat) => ({ id, nombre, hist: [], ultimo: null, bateria: bat, visto: ahora, demo: true, nuevo: false });
  const cs = [mk(DEMO_IDS[0], 'Cencerro', 18), mk(DEMO_IDS[1], 'Manchada', 71), mk(DEMO_IDS[2], 'Oveja 3', 64)];
  const ll = (x, y, t) => { const [lat, lon] = mLL(x, y); return { lat, lon, t }; };
  let fijo = null, salida = null;
  for (let t = ahora - 30 * H; t <= ahora; t += paso) {
    const [fx, fy] = majada(t);
    cs[0].hist.push(ll(fx + rnd() * 40, fy + rnd() * 40, t));
    if (t < ahora - FUERA) cs[1].hist.push(ll(fx + 40 + rnd() * 50, fy + rnd() * 50, t));
    else { if (!salida) salida = [fx + 40, fy]; const k = (t - (ahora - FUERA)) / FUERA; cs[1].hist.push(ll(salida[0] + (870 - salida[0]) * k + rnd() * 20, salida[1] + (120 - salida[1]) * k + rnd() * 20, t)); }
    if (t < ahora - QUIETA) cs[2].hist.push(ll(fx - 30 + rnd() * 50, fy + 30 + rnd() * 50, t));
    else { if (!fijo) fijo = [fx - 30, fy + 30]; cs[2].hist.push(ll(fijo[0] + rnd() * 10, fijo[1] + rnd() * 10, t)); }
  }
  for (const c of cs) { c.ultimo = c.hist[c.hist.length - 1]; S.collares[c.id] = c; }
  S.cfg.demoFijo = fijo; S.base = { id: '!de0000ba', visto: ahora, demo: true };
}
function tickDemo(){
  const ahora = Date.now(); const cs = DEMO_IDS.map(id => S.collares[id]); if (cs.some(c => !c)) return;
  const [fx, fy] = majada(ahora);
  const add = (c, x, y) => { const [lat, lon] = mLL(x, y); c.hist.push({ lat, lon, t: ahora }); c.hist = c.hist.filter(q => q.t >= ahora - HIST_MS).slice(-HIST_MAX); c.ultimo = c.hist[c.hist.length - 1]; c.visto = ahora; };
  add(cs[0], fx + rnd() * 40, fy + rnd() * 40);
  const u = cs[1].ultimo, k = Math.cos(rad(DC[0])) * 111320; add(cs[1], (u.lon - DC[1]) * k + rnd() * 16, (u.lat - DC[0]) * 111320 + rnd() * 16);
  const f = S.cfg.demoFijo || [0, 0]; add(cs[2], f[0] + rnd() * 10, f[1] + rnd() * 10);
  if (S.base) S.base.visto = ahora;
}

  let primera = true;
  if (watchId == null) watchId = navigator.geolocation.watchPosition(p => { S.yo = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
    if (primera) { primera = false; M.lat = S.yo.lat; M.lon = S.yo.lon; if (M.z < 16) M.z = 16; } pedirDibujo(); if (S.sel) pintarPanel(); }, e => { err(e); navigator.geolocation.clearWatch(watchId); watchId = null; }, { enableHighAccuracy: true, timeout: 30000, maximumAge: 10000 });
  else if (S.yo) { M.lat = S.yo.lat; M.lon = S.yo.lon; pedirDibujo(); }
}
function rerenderForm(){ const y = window.scrollY; pintarOtro(); window.scrollTo(0, y); }

/* ---------- eventos ---------- */
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act]');
  if (!t) { if (ev.target.id === 'sheet') { closeSheet(); if (confirmRes) { confirmRes(false); confirmRes = null; } } return; }
  if (t.disabled) return; const a = t.dataset.act, d = S.draft;
  switch (a) {
    case 'go': go(t.dataset.v); break;
    case 'sel': seleccionar(t.dataset.id); break;
    case 'desel': S.sel = null; pintarPanel(); pedirDibujo(); break;
    case 'centrar': { const c = S.collares[S.sel]; if (c && c.ultimo) { M.lat = c.ultimo.lat; M.lon = c.ultimo.lon; if (M.z < 16) M.z = 16; pedirDibujo(); window.scrollTo({ top: 0, behavior: 'smooth' }); } break; }
    case 'capa': S.cfg.capa = S.cfg.capa === 'sat' ? 'mapa' : 'sat'; guardar(); pedirDibujo(); break;
    case 'ver-reg': S.cfg.verRegistros = !S.cfg.verRegistros; guardar(); pedirDibujo(); break;
    case 'zin': zoomEn(M.w / 2, M.h / 2, 1); break;
    case 'zout': zoomEn(M.w / 2, M.h / 2, -1); break;
    case 'fit': { const p = puntosTodos(); if (p.length) encuadrar(p); else toast('Todavía no hay ubicaciones.'); break; }
    case 'yo': miUbicacion(); break;
    case 'edit-start': empezarEdit(); break;
    case 'edit-yo': miUbicacion('punto'); break;
    case 'edit-undo': S.editPts.pop(); pintarEdit(); pedirDibujo(); break;
    case 'edit-ok': terminarEdit(true); break;
    case 'edit-cancel': terminarEdit(false); break;
    case 'borrar-limite': S.cfg.limite = []; S.cfg.limiteDemo = false; evaluar(); guardar(); pintarOtro(); toast('Límite borrado'); break;
    case 'leidas': S.alertas.forEach(x => x.nueva = false); guardar(); pintarTodo(); pintarOtro(); break;
    case 'ver-alerta': { const al = S.alertas.find(x => x.id === t.dataset.id); if (!al) break; al.nueva = false; guardar();
      if (al.collar && S.collares[al.collar]) seleccionar(al.collar); else go('mapa'); pintarTodo(); break; }
    case 'quitar': delete S.collares[t.dataset.id]; delete S.estado[t.dataset.id]; if (S.sel === t.dataset.id) S.sel = null; guardar(); pintarOtro(); toast('Collar quitado. Si vuelve a mandar señal, aparece de nuevo.'); break;
    case 'conectar': if (!S.cfg.mqtt.url.trim()) { toast('Completá la dirección del servidor.'); break; }
      if (S.cfg.demo) await quitarDemo(); guardar(); conectar(); pintarOtro(); break;
    case 'empezar': if (await confirmar('Se borran las ovejas y los registros de ejemplo. Lo que cargaste vos no se toca.', 'Borrar ejemplos')) {
      await quitarDemo(); conectar(); evaluar(); pintarTodo(); if (S.tab !== 'mapa') pintarOtro(); toast('Listo. Empezá marcando el límite del campo o cargando un registro.'); } break;
    case 'borrar-hist': for (const c of Object.values(S.collares)) c.hist = c.ultimo ? [c.ultimo] : []; S.alertas = []; guardar(); pintarTodo(); pintarOtro(); toast('Recorridos y avisos borrados'); break;
    case 'borrar-todo': if (await confirmar(`¿Borrar los ${S.eventos.length} registros de pérdidas y sarna? Hacé una copia antes. No se puede deshacer.`, 'Borrar todo', true)) { S.eventos = []; await DB.evClear(); pintarOtro(); pintarTodo(); toast('Se borraron todos los registros'); } break;
    /* registros */
    case 'nuevo': nuevoRegistro(t.dataset.tipo); break;
    case 'perdida-collar': { const c = S.collares[S.sel]; if (!c || !c.ultimo) break;
      nuevoRegistro('perdida', { lat: c.ultimo.lat, lon: c.ultimo.lon, precision: null, ubicCollar: true, desdeCollar: c.id, notas: `Encontrada con el collar "${c.nombre}".` }); break; }
    case 'revisar': closeSheet(); nuevoRegistro('sarna', { accion: 'revision', tratamientoId: t.dataset.id, potrero: (S.eventos.find(e => e.id === t.dataset.id) || {}).potrero || null }); break;
    case 'cancelar': S.draft = null; go(S.volver === 'mapa' ? 'mapa' : 'registros'); break;
    case 'chip': { const f = t.dataset.field, val = t.dataset.val;
      if (t.dataset.multi) { const arr = d[f]; const i = arr.indexOf(val); i >= 0 ? arr.splice(i, 1) : arr.push(val); t.setAttribute('aria-pressed', i < 0); break; }
      if (f === 'filtro') break; d[f] = val;
      if (f === 'tratamientoId') { const tr = S.eventos.find(e => e.id === val); if (tr && tr.potrero) d.potrero = tr.potrero; }
      rerenderForm();
      if (f === 'accion' && val === 'casos' && S.cfg.gpsAuto && d.lat == null) tomarGPS();
      if (f === 'potrero' && val === '__nuevo') { const i = $('#f-potnuevo'); if (i) i.focus(); } break; }
    case 'step': { const f = t.dataset.field; const v = Math.max(1, (parseInt(d[f], 10) || 0) + parseInt(t.dataset.d, 10)); d[f] = v; const inp = t.parentNode.querySelector('input'); if (inp) inp.value = v; break; }
    case 'gps': tomarGPS(); break;
    case 'gps-quitar': d.lat = d.lon = d.precision = null; d.ubicCollar = false; $('#gpsbox').outerHTML = gpsHTML(d); break;
    case 'foto-quitar': d.foto = null; $('#fotobox').outerHTML = fotoHTML(d); break;
    case 'guardar-reg': guardarRegistro(); break;
    case 'filtro': S.filtro = t.dataset.v; pintarOtro(); break;
    case 'ver': verDetalle(t.dataset.id); break;
    case 'cerrar': closeSheet(); break;
    case 'reg-mapa': { const e = S.eventos.find(x => x.id === t.dataset.id); closeSheet(); if (!e || e.lat == null) break; S.cfg.verRegistros = true; S.sel = null; go('mapa'); M.lat = e.lat; M.lon = e.lon; if (M.z < 17) M.z = 17; pedirDibujo(); break; }
    case 'borrar-reg': { const id = t.dataset.id; if (await confirmar('¿Borrar este registro? No se puede deshacer.', 'Borrar', true)) { S.eventos = S.eventos.filter(e => e.id !== id); await DB.evDel(id); toast('Registro borrado'); if (S.tab === 'mapa') pedirDibujo(); else pintarOtro(); } break; }
    case 'conf-si': if (confirmRes) { const r = confirmRes; confirmRes = null; closeSheet(); r(true); } break;
    case 'conf-no': if (confirmRes) { const r = confirmRes; confirmRes = null; closeSheet(); r(false); } break;
    case 'add-pot': { const i = $('#cfg-newpot'); const v = (i.value || '').trim(); if (!v) { toast('Escribí el nombre del potrero.'); break; } if (!S.cfg.potreros.includes(v)) S.cfg.potreros.push(v); guardar(); pintarOtro(); toast('Potrero agregado'); break; }
    case 'quitar-pot': S.cfg.potreros = S.cfg.potreros.filter(p => p !== t.dataset.v); guardar(); pintarOtro(); break;
    case 'backup': backup(); break;
    case 'restore': $('#f-restore').click(); break;
    case 'csv': csv(); break;
    case 'imprimir': window.print(); break;
    case 'instalar': if (S.installEvt) { S.installEvt.prompt(); try { await S.installEvt.userChoice; } catch(e) {} S.installEvt = null; pintarOtro(); } break;
  }
});
document.addEventListener('input', ev => { const t = ev.target; if (t.dataset.field && S.draft) S.draft[t.dataset.field] = t.value; });
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.dataset.nombre) { const c = S.collares[t.dataset.nombre]; if (c) { c.nombre = t.value.trim().slice(0, 24) || c.nombre; c.nuevo = false; guardar(); toast('Nombre guardado'); } }
  else if (t.dataset.cfgn) { const v = Number(t.value); if (v > 0) { S.cfg[t.dataset.cfgn] = v; guardar(); evaluar(); toast('Guardado'); } }
  else if (t.dataset.cfg) { S.cfg[t.dataset.cfg] = t.value.trim(); guardar(); pintarConn(); toast('Guardado'); }
  else if (t.dataset.mqtt) { S.cfg.mqtt[t.dataset.mqtt] = t.value; guardar(); }
  else if (t.id === 'sw-demo') { if (t.checked) { await activarDemo(); encuadrar(puntosTodos()); } else await quitarDemo(); conectar(); evaluar(); pintarOtro(); pintarTodo(); }
  else if (t.id === 'sw-notif') {
    if (t.checked) { if (!('Notification' in window)) { toast('Este navegador no permite avisos.'); t.checked = false; return; }
      const p = await Notification.requestPermission(); if (p !== 'granted') { toast('No diste permiso para los avisos.'); t.checked = false; return; } }
    S.cfg.notif = t.checked; guardar(); if (t.checked) notificar('Avisos activados', 'Así te van a llegar los avisos de las ovejas.', 'prueba'); }
  else if ((t.id === 'f-cam' || t.id === 'f-gal') && t.files[0] && S.draft) { const d = S.draft;
    try { d.foto = await comprimir(t.files[0]); } catch(e) { toast('No se pudo leer la foto.'); } const b = $('#fotobox'); if (b && S.draft === d) b.outerHTML = fotoHTML(d); }
  else if (t.id === 'f-restore' && t.files[0]) { await restaurar(t.files[0]); t.value = ''; }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#sheet').hidden) { closeSheet(); if (confirmRes) { confirmRes(false); confirmRes = null; } } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (S.cfg.demo) tickDemo(); evaluar(); pintarTodo(); } });
addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.tab === 'ajustes') pintarOtro(); });
if (PWA && 'serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

(async function init(){
  await DB.open();
  S.eventos = await DB.evAll();
  const cfg = await DB.get('cfg');
  if (cfg) { const d = defCfg(); S.cfg = { ...d, ...cfg, mqtt: { ...d.mqtt, ...(cfg.mqtt || {}) } };
    S.collares = (await DB.get('collares')) || {}; S.alertas = (await DB.get('alertas')) || []; S.estado = (await DB.get('estado')) || {}; S.base = await DB.get('base'); }
  else { // primera vez: si venía usando el cuaderno anterior, se respetan sus datos
    const old = await DB.legacyCfg(); if (old) { S.cfg.campo = old.campo || ''; S.cfg.potreros = (old.potreros || []).slice(); S.cfg.gpsAuto = !!old.gpsAuto; S.cfg.ultimoPotrero = old.ultimoPotrero || null; }
    const hayReales = S.eventos.some(e => !e.ejemplo);
    if (hayReales) { S.cfg.demo = false; const ej = S.eventos.filter(e => e.ejemplo); S.eventos = S.eventos.filter(e => !e.ejemplo); for (const e of ej) await DB.evDel(e.id); }
    else { S.eventos = []; await DB.evClear(); S.cfg.potreros = []; await activarDemo(); }
  }
  if (S.cfg.demo) { if (!Object.values(S.collares).some(c => c.demo)) crearDemo(); else tickDemo(); await crearRegistrosEjemplo(); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
  iniciarGestos();
  if (S.cfg.vista) { M.lat = S.cfg.vista.lat; M.lon = S.cfg.vista.lon; M.z = S.cfg.vista.z; } else { M.lat = -45.86; M.lon = -67.5; M.z = 11; }
  evaluar(); go('mapa'); pintarTodo(); guardar();
  if (!S.cfg.vista && puntosTodos().length) encuadrar(puntosTodos());
  conectar();
  setInterval(() => { if (document.hidden) return; if (S.cfg.demo) tickDemo(); evaluar(); pintarTodo(); }, 15000);
})();
})();

</script>
